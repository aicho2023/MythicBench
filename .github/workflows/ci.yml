name: CI
on: [push, pull_request]
# CI only reads the code: give its GitHub token no write access.
permissions:
  contents: read
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e "sim[dev]"
      - run: cd sim && python -m pytest -q
      # The committed replays must be exactly what the simulator produces.
      - run: cd sim && python -m mythicsim generate --out ../web/public/replays && git diff --exit-code ../web/public/replays
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run typecheck && npm test && npm run build
